services:
  - type: web
    name: bah-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: INFERENCE_MODE
        value: remote
      - key: VLLM_BASE_URL
        sync: false
      - key: VLLM_API_KEY
        sync: false
      - key: VLLM_MODEL
        value: bah
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: ANALYTICS_OPTIONAL
        value: "false"
